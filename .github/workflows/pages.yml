name: Publish Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'report.json'
      - 'dns-logs.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Chuẩn bị thư mục publish
        run: |
          mkdir -p _site/dashboard
          cp -r dashboard/* _site/dashboard/
          cp report.json _site/report.json 2>/dev/null || echo "[]" > _site/report.json
          cp dns-logs.json _site/dns-logs.json 2>/dev/null || echo "{}" > _site/dns-logs.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
